  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=6592e928c541626958ef6c1d3a55f7d7&amp;libraries=services&amp;autoload=false"></script>
  <script>
    const campusData={
      "인사캠":{campusQuery:"성균관대학교 인문사회과학캠퍼스",depart:"12:10",returnTime:"14:00",defaultStart:"경영관",defaultEnd:"퇴계인문관",extraSearchQueries:["혜화역","대학로 마로니에공원"],buildings:["혜화역","퇴계인문관","다산경제관","경영관","법학관","호암관","수선관","국제관","600주년기념관"].map(name=>({name,coord:null}))},
      "자과캠":{campusQuery:"성균관대학교 자연과학캠퍼스",depart:"12:20",returnTime:"14:00",defaultStart:"제1공학관",defaultEnd:"기초학문관",extraSearchQueries:[],buildings:["기초학문관","제1공학관","제2공학관","반도체관","제1과학관","제2과학관","생명공학관","약학관","의학관"].map(name=>({name,coord:null}))}
    };
    const WALK_API_URL="/api/walk";
    const WALK_ROUTE_MODE="SHORTEST";
    const MAX_WALK_CANDIDATES=15;
    let campus="인사캠",map,places,routeLine,requestId=0,markers=[],lastRestaurants=[],lastCafes=[],activeResultTab="restaurant",selectedRestaurant=null,selectedCafe=null,coordinatesReady=false;
    const $=selector=>document.querySelector(selector),$$=selector=>[...document.querySelectorAll(selector)];
    const escapeHtml=value=>String(value).replace(/[&<>'"]/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[char]));
    function distanceMeters(a,b){const r=6371000,toRad=n=>n*Math.PI/180,dLat=toRad(b[0]-a[0]),dLng=toRad(b[1]-a[1]),lat1=toRad(a[0]),lat2=toRad(b[0]);const h=Math.sin(dLat/2)**2+Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLng/2)**2;return 2*r*Math.asin(Math.sqrt(h))}
    function minutesOfDay(value){const[h,m]=value.split(":").map(Number);return h*60+m}
    function timeAfter(value,minutes){const total=minutesOfDay(value)+minutes;return `${String(Math.floor(total/60)%24).padStart(2,"0")}:${String(total%60).padStart(2,"0")}`}
    function formatDistance(meters){return meters<1000?`${Math.round(meters/10)*10}m`:`${(meters/1000).toFixed(1)}km`}
    function selectedBuilding(id){return campusData[campus].buildings.find(item=>item.name===$(id).value)}
    function midpoint(a,b){return[(a[0]+b[0])/2,(a[1]+b[1])/2]}
    function settings(){const depart=$("#depart").value,returnTime=$("#returnTime").value,meal=Number($("#mealMinutes").value),cafe=Number($("#cafeMinutes").value);return{depart,returnTime,meal,cafe,available:minutesOfDay(returnTime)-minutesOfDay(depart)}}
    function validSettings(){const value=settings();if(value.available<=0)return"복귀 시간은 출발 시간보다 늦어야 해요.";if(value.available<=value.meal+value.cafe)return"식사·카페 시간을 제외하고 이동할 시간이 부족해요.";return""}
    function toPlace(item){return{id:item.id||item.place_url,name:item.place_name,category:item.category_name,coord:[Number(item.y),Number(item.x)],address:item.road_address_name||item.address_name,phone:item.phone||"정보 없음",url:item.place_url}}
    function keywordSearchOne(query,near=null,radius=5000){return new Promise(resolve=>{const options={size:15,sort:kakao.maps.services.SortBy.ACCURACY};if(near){options.location=new kakao.maps.LatLng(near[0],near[1]);options.radius=radius}places.keywordSearch(query,(data,status)=>{if(status!==kakao.maps.services.Status.OK||!data.length){resolve(null);return}const normalized=query.replace(/\s/g,"");const scored=data.map(item=>{const name=(item.place_name||"").replace(/\s/g,"");let score=0;if(name===normalized)score+=100;if(name.includes(normalized)||normalized.includes(name))score+=50;if((item.category_name||"").includes("성균관대학교"))score+=20;if(near)score-=distanceMeters(near,[Number(item.y),Number(item.x)])/500;return{item,score}}).sort((a,b)=>b.score-a.score);resolve(toPlace(scored[0].item))},options)})}
    async function resolveBuilding(building,campusCenter){const data=campusData[campus],queries=building.name==="혜화역"?["혜화역","서울 혜화역"]:[`${data.campusQuery} ${building.name}`,`성균관대학교 ${building.name}`,`${building.name} 성균관대학교`];for(const query of queries){const found=await keywordSearchOne(query,campusCenter,4500);if(found){building.coord=found.coord;building.address=found.address;building.kakaoName=found.name;building.url=found.url;return true}}return false}
    async function resolveCampusCoordinates(){coordinatesReady=false;const data=campusData[campus];$("#recommend").disabled=true;$("#routeTitle").textContent="카카오맵에서 건물 좌표를 확인하는 중…";const campusPlace=await keywordSearchOne(data.campusQuery);if(!campusPlace)throw new Error(`${data.campusQuery} 위치를 카카오맵에서 찾지 못했어요.`);data.center=campusPlace.coord;const results=await Promise.all(data.buildings.map(building=>resolveBuilding(building,data.center)));const missing=data.buildings.filter((_,i)=>!results[i]).map(item=>item.name);if(missing.length)throw new Error(`카카오맵에서 건물 위치를 찾지 못했어요: ${missing.join(", ")}`);const extras=[];for(const query of data.extraSearchQueries||[]){const found=await keywordSearchOne(query,data.center,6000);if(found)extras.push(found.coord)}data.searchCenters=[data.center,...extras];coordinatesReady=true;map.setCenter(new kakao.maps.LatLng(data.center[0],data.center[1]));$("#recommend").disabled=false}
    function searchCategoryAt(category,center,radius,maxPages=2){return new Promise((resolve,reject)=>{const collected=[];let pageCount=0;const callback=(data,status,pagination)=>{if(status===kakao.maps.services.Status.ZERO_RESULT){resolve(collected);return}if(status!==kakao.maps.services.Status.OK){reject(new Error("카카오 장소 검색 요청에 실패했습니다."));return}collected.push(...data.map(toPlace));pageCount+=1;if(pagination.hasNextPage&&pageCount<maxPages)pagination.nextPage();else resolve(collected)};places.categorySearch(category,callback,{location:new kakao.maps.LatLng(center[0],center[1]),radius,sort:kakao.maps.services.SortBy.DISTANCE,size:15})})}
    async function searchCategory(category,centers,radius,reference){const groups=await Promise.all(centers.map(center=>searchCategoryAt(category,center,radius)));const unique=new Map();groups.flat().forEach(place=>{if(!unique.has(place.id))unique.set(place.id,place)});return[...unique.values()].sort((a,b)=>distanceMeters(reference,a.coord)-distanceMeters(reference,b.coord)).slice(0,60)}
    function searchCenters(start,end,extra=[]){const data=campusData[campus],centers=[start.coord,end.coord,midpoint(start.coord,end.coord),...extra,...(data.searchCenters||[])].filter(Boolean);return centers.filter((center,index,array)=>array.findIndex(other=>Math.abs(other[0]-center[0])<.0001&&Math.abs(other[1]-center[1])<.0001)===index)}
    function heuristicRouteFromPlaces(start,end,restaurant,cafe){const firstMeters=distanceMeters(start.coord,restaurant.coord),secondMeters=distanceMeters(restaurant.coord,cafe.coord),thirdMeters=distanceMeters(cafe.coord,end.coord),firstWalk=Math.max(1,Math.ceil(firstMeters/75)),secondWalk=Math.max(1,Math.ceil(secondMeters/75)),thirdWalk=Math.max(1,Math.ceil(thirdMeters/75)),walk=firstWalk+secondWalk+thirdWalk,meters=firstMeters+secondMeters+thirdMeters,{depart,meal,cafe:cafeStay}=settings(),restaurantAt=timeAfter(depart,firstWalk),cafeAt=timeAfter(depart,firstWalk+meal+secondWalk),duration=walk+meal+cafeStay,finishAt=timeAfter(depart,duration);return{restaurant,cafe,meters,walk,duration,restaurantAt,cafeAt,finishAt,firstWalk,secondWalk,thirdWalk,source:"heuristic"}}
    function walkQuery(start,end,restaurant,cafe){const params=new URLSearchParams({start_x:String(start.coord[1]),start_y:String(start.coord[0]),end_x:String(end.coord[1]),end_y:String(end.coord[0]),s_name:start.name,e_name:end.name,input_coord:"WGS84",output_coord:"WGS84",route_mode:WALK_ROUTE_MODE});const vias=[restaurant,cafe].filter(Boolean);if(vias.length){params.set("via_x",vias.map(place=>place.coord[1]).join(","));params.set("via_y",vias.map(place=>place.coord[0]).join(","));params.set("v_name",vias.map(place=>place.name.replace(/,/g," ")).join(","))}return params}
    async function fetchWalkingRoute(start,end,restaurant,cafe){const response=await fetch(`${WALK_API_URL}?${walkQuery(start,end,restaurant,cafe)}`,{method:"GET",headers:{Accept:"application/json"}});let data=null;try{data=await response.json()}catch(_){data=null}if(!response.ok)throw new Error(data?.message||`카카오 도보 경로 요청 실패 (${response.status})`);if(data?.status!=="OK"||!data.route)throw new Error(`도보 경로를 찾지 못했어요 (${data?.status||"UNKNOWN"})`);const props=data.route.properties||{},legs=data.route.legs||[];const path=[];legs.forEach(leg=>(leg.steps||[]).forEach(step=>(step.path?.points||[]).forEach(point=>{const lat=Number(point[1]),lng=Number(point[0]);if(Number.isFinite(lat)&&Number.isFinite(lng))path.push([lat,lng])})));if(path.length<2)throw new Error("카카오 도보 경로 좌표가 비어 있어요.");const legTimes=legs.map(leg=>Math.max(0,Math.ceil((leg.properties?.time||0)/60))),legDistances=legs.map(leg=>Number(leg.properties?.distance||0));const {depart,meal,cafe:cafeStay}=settings();const firstWalk=legTimes[0]??0,secondWalk=legTimes[1]??0,thirdWalk=legTimes[2]??0,walk=Math.max(1,Math.ceil((props.totalTime||0)/60)),meters=Number(props.totalDistance||0),restaurantAt=timeAfter(depart,firstWalk),cafeAt=timeAfter(depart,firstWalk+meal+secondWalk),duration=walk+meal+cafeStay,finishAt=timeAfter(depart,duration);return{restaurant,cafe,meters,walk,duration,restaurantAt,cafeAt,finishAt,firstWalk,secondWalk,thirdWalk,legTimes,legDistances,path,landingUrl:props.landingUrl||"",source:"kakao-walk"}}
    function renderTimeline(start,end,restaurant=null,cafe=null,route=null){const plan=settings(),restaurantAt=route?.restaurantAt||(restaurant?timeAfter(plan.depart,Math.max(1,Math.ceil(distanceMeters(start.coord,restaurant.coord)/75))):"--:--"),cafeAt=route?.cafeAt||"--:--",endAt=route?.finishAt||plan.returnTime||"--:--";$("#timelineTrack").innerHTML=`<div class="timeline-stop"><i>S</i><span>${escapeHtml(start.name)}</span><strong>${plan.depart}</strong><small>출발</small></div><b></b><div class="timeline-stop food"><i>F</i><span>${restaurant?escapeHtml(restaurant.name):"식당 선택"}</span><strong>${restaurantAt}</strong><small>${restaurant?`식사 ${plan.meal}분`:"미선택"}</small></div><b></b><div class="timeline-stop cafe"><i>C</i><span>${cafe?escapeHtml(cafe.name):"카페 선택"}</span><strong>${cafeAt}</strong><small>${cafe?`카페 ${plan.cafe}분`:"미선택"}</small></div><b></b><div class="timeline-stop end"><i>E</i><span>${escapeHtml(end.name)}</span><strong>${endAt}</strong><small>${route?"복귀 예정":"복귀 마감"}</small></div>`}
    function isFeasible(route){return route.duration<=settings().available}
    function populateControls(reset=false){const data=campusData[campus],oldStart=reset?"":$("#start").value,oldEnd=reset?"":$("#end").value,options=data.buildings.map(item=>`<option value="${escapeHtml(item.name)}">${escapeHtml(item.name)}</option>`).join("");$("#start").innerHTML=options;$("#end").innerHTML=options;$("#start").value=data.buildings.some(item=>item.name===oldStart)?oldStart:data.defaultStart;$("#end").value=data.buildings.some(item=>item.name===oldEnd)?oldEnd:data.defaultEnd;if(reset||!$("#depart").value)$("#depart").value=data.depart;if(reset||!$("#returnTime").value)$("#returnTime").value=data.returnTime}
    function clearMap(){markers.forEach(marker=>marker.setMap(null));markers=[];if(routeLine){routeLine.setMap(null);routeLine=null}}
    function addMarker(place,clickHandler){const marker=new kakao.maps.Marker({map,position:new kakao.maps.LatLng(place.coord[0],place.coord[1]),title:place.name});if(clickHandler)kakao.maps.event.addListener(marker,"click",clickHandler);markers.push(marker)}
    function showPlace(place,type,start){$("#placeKind").textContent=type;$("#placeName").textContent=place.name;$("#placeCategory").textContent=place.category;$("#placeAddress").textContent=place.address||"주소 정보가 없습니다.";$("#placeDistance").textContent=formatDistance(distanceMeters(start.coord,place.coord));$("#placePhone").textContent=place.phone;$("#placeLink").href=place.url;$("#placeTags").replaceChildren();place.category.split(" > ").slice(-2).forEach(tag=>{const span=document.createElement("span");span.textContent=tag;$("#placeTags").append(span)});$("#placeSheet").classList.remove("hide")}
    function renderBaseMarkers(start,end,restaurant=null){clearMap();addMarker(start);if(restaurant)addMarker(restaurant,()=>showPlace(restaurant,"식당",start));addMarker(end);renderTimeline(start,end,restaurant)}
    function resetRouteSummary(title,count=0){$("#routeTitle").textContent=title;$("#returnAt").textContent=$("#returnTime").value||"--:--";$("#totalTime").textContent="-";$("#walkTime").textContent="-";$("#resultCount").textContent=`${count}곳`;$("#routeFlow").innerHTML=""}
    function isSelected(place){return place.id===(activeResultTab==="restaurant"?selectedRestaurant?.id:selectedCafe?.id)}
    async function selectRestaurant(place,start,end){const currentRequest=++requestId;selectedRestaurant=place;selectedCafe=null;lastCafes=[];renderBaseMarkers(start,end,place);showPlace(place,"식당",start);activeResultTab="cafe";renderCandidateList(start);$("#resultPanelTitle").textContent="카페 후보 검색 중…";$("#routeTitle").textContent="카카오맵에서 카페를 찾는 중…";try{const radius=Number($("#radius").value),cafes=await searchCategory("CE7",searchCenters(start,end,[place.coord]),radius,place.coord);if(currentRequest!==requestId)return;const shortlist=cafes.map(cafe=>({place:cafe,heuristic:heuristicRouteFromPlaces(start,end,place,cafe)})).sort((a,b)=>a.heuristic.duration-b.heuristic.duration).slice(0,MAX_WALK_CANDIDATES);lastCafes=shortlist.filter(item=>isFeasible(item.heuristic)).map(item=>Object.assign(item.place,{_walkRoute:null,_heuristicRoute:item.heuristic}));activeResultTab="cafe";renderCandidateList(start);resetRouteSummary(lastCafes.length?"카페 후보를 불러왔어요 · 실제 도보 검증 중":"시간 안에 가능한 카페 후보가 없어요",lastRestaurants.length+lastCafes.length);const settled=await Promise.all(shortlist.map(async item=>{try{return{place:item.place,route:await fetchWalkingRoute(start,end,place,item.place)}}catch(error){console.warn("walking route failed",item.place.name,error);return{place:item.place,route:null,error}}}));if(currentRequest!==requestId)return;const realRoutes=settled.filter(item=>item.route);if(realRoutes.length){lastCafes=settled.map(item=>{const heuristic=item.place._heuristicRoute||heuristicRouteFromPlaces(start,end,place,item.place);return Object.assign(item.place,{_walkRoute:item.route,_heuristicRoute:heuristic,_walkError:item.error?.message||""})}).filter(cafe=>isFeasible(cafe._walkRoute||cafe._heuristicRoute)).sort((a,b)=>(a._walkRoute||a._heuristicRoute).duration-(b._walkRoute||b._heuristicRoute).duration);renderCandidateList(start);resetRouteSummary("실제 도보 기준 카페를 선택하세요",lastRestaurants.length+lastCafes.length)}else{lastCafes=shortlist.filter(item=>isFeasible(item.heuristic)).map(item=>Object.assign(item.place,{_walkRoute:null,_heuristicRoute:item.heuristic,_walkError:"실제 도보 API 연결 실패"}));renderCandidateList(start);resetRouteSummary("카페는 불러왔지만 카카오 도보 API 직접 호출이 실패했어요",lastRestaurants.length+lastCafes.length)}}catch(error){if(currentRequest===requestId){lastCafes=[];renderCandidateList(start);resetRouteSummary(error.message,lastRestaurants.length)}}}
    async function selectCafe(place,start,end){selectedCafe=place;showPlace(place,"카페",start);$("#routeTitle").textContent="카카오 실제 도보 경로를 불러오는 중…";try{const route=place._walkRoute||await fetchWalkingRoute(start,end,selectedRestaurant,place);place._walkRoute=route;renderRoute(start,end,route,lastRestaurants.length+lastCafes.length)}catch(error){clearMap();addMarker(start);addMarker(selectedRestaurant,()=>showPlace(selectedRestaurant,"식당",start));addMarker(place,()=>showPlace(place,"카페",start));addMarker(end);renderTimeline(start,end,selectedRestaurant,place,null);$("#routeTitle").textContent=`실제 도보 경로를 불러오지 못했어요 · ${error.message}`;$("#returnAt").textContent="--:--";$("#totalTime").textContent="-";$("#walkTime").textContent="-"}}
    function renderCandidateList(start){const restaurantTab=$('[data-result-tab="restaurant"]'),cafeTab=$('[data-result-tab="cafe"]');cafeTab.disabled=!selectedRestaurant;const items=activeResultTab==="restaurant"?lastRestaurants:lastCafes,type=activeResultTab==="restaurant"?"식당":"카페";$("#resultPanelTitle").textContent=activeResultTab==="restaurant"?"식당을 먼저 선택하세요":selectedRestaurant?"복귀 가능한 카페 후보":"식당 선택 후 카페가 생성돼요";$("#restaurantCount").textContent=lastRestaurants.length;$("#cafeCount").textContent=lastCafes.length;$$("[data-result-tab]").forEach(button=>button.classList.toggle("active",button.dataset.resultTab===activeResultTab));if(!items.length){$("#resultList").innerHTML=`<div class="result-empty">${activeResultTab==="cafe"&&!selectedRestaurant?"식당을 선택하면 시간에 맞는 카페 후보가 생성됩니다.":"검색 결과가 없습니다."}</div>`;return}$("#resultList").innerHTML=items.map((place,index)=>{const selected=isSelected(place),route=activeResultTab==="cafe"&&selectedRestaurant?(place._walkRoute||place._heuristicRoute||heuristicRouteFromPlaces(selectedBuilding("#start"),selectedBuilding("#end"),selectedRestaurant,place)):null;return`<button class="result-item${selected?" selected":""}" data-result-index="${index}" aria-pressed="${selected}"><strong>${escapeHtml(place.name)}</strong><b>${selected?"선택됨":"선택"}</b><span>${escapeHtml(place.category)}</span><span>${escapeHtml(place.address||"주소 정보 없음")}</span><em>${route?`예상 복귀 ${route.finishAt} · 총 ${route.duration}분${route.source==="kakao-walk"?" · 실제 도보":""}`:`출발점에서 ${formatDistance(distanceMeters(start.coord,place.coord))}`}</em></button>`}).join("");$$("[data-result-index]").forEach(button=>button.addEventListener("click",()=>{const place=items[Number(button.dataset.resultIndex)],end=selectedBuilding("#end");if(activeResultTab==="restaurant")selectRestaurant(place,start,end);else selectCafe(place,start,end)}))}
    function renderRoute(start,end,route,resultCount){if(route.source!=="kakao-walk"||!route.path?.length)throw new Error("실제 도보 경로 좌표가 없습니다.");const routePoints=route.path;$("#routeTitle").textContent=route.source==="kakao-walk"?"카카오 실제 도보 경로":"시간 안에 복귀 가능한 코스";$("#returnAt").textContent=route.finishAt;$("#totalTime").textContent=`${route.duration}분`;$("#walkTime").textContent=`${route.walk}분 · ${formatDistance(route.meters)}`;$("#resultCount").textContent=`${resultCount}곳`;$("#routeFlow").innerHTML=`<div><i>S</i><span>${escapeHtml(start.name)}</span></div><b></b><div><i>F</i><span>${escapeHtml(route.restaurant.name)}</span></div><b></b><div><i>C</i><span>${escapeHtml(route.cafe.name)}</span></div><b></b><div><i>E</i><span>${escapeHtml(end.name)}</span></div>`;clearMap();routeLine=new kakao.maps.Polyline({map,path:routePoints.map(coord=>new kakao.maps.LatLng(coord[0],coord[1])),strokeWeight:7,strokeColor:"#0b6046",strokeOpacity:.86,strokeStyle:"solid"});addMarker(start);addMarker(route.restaurant,()=>showPlace(route.restaurant,"식당",start));addMarker(route.cafe,()=>showPlace(route.cafe,"카페",start));addMarker(end);const bounds=new kakao.maps.LatLngBounds();routePoints.forEach(coord=>bounds.extend(new kakao.maps.LatLng(coord[0],coord[1])));map.setBounds(bounds,90,60,Math.min(250,innerHeight*.3),innerWidth<650?30:innerWidth<1060?300:420);renderTimeline(start,end,route.restaurant,route.cafe,route);renderCandidateList(start)}
    function showError(message,fullScreen=false){resetRouteSummary(message);if(fullScreen){$("#mapError").querySelector("span").textContent=message;$("#mapError").style.display="grid"}}
    async function recommend(){if(!map||!places)return;if(!coordinatesReady){resetRouteSummary("건물 좌표를 확인하는 중…");return}const validation=validSettings(),start=selectedBuilding("#start"),end=selectedBuilding("#end");if(validation){lastRestaurants=[];lastCafes=[];selectedRestaurant=null;selectedCafe=null;renderBaseMarkers(start,end);renderCandidateList(start);showError(validation);return}const currentRequest=++requestId,radius=Number($("#radius").value),button=$("#recommend");selectedRestaurant=null;selectedCafe=null;lastCafes=[];activeResultTab="restaurant";button.disabled=true;button.firstElementChild.textContent="식당 후보 검색 중…";$("#routeTitle").textContent="카카오맵에서 식당을 찾는 중…";$("#placeSheet").classList.add("hide");renderBaseMarkers(start,end);renderCandidateList(start);try{const restaurants=await searchCategory("FD6",searchCenters(start,end),radius,start.coord);if(currentRequest!==requestId)return;lastRestaurants=restaurants;renderBaseMarkers(start,end);renderCandidateList(start);resetRouteSummary(restaurants.length?"식당 후보를 선택하세요":"식당 후보를 찾지 못했어요",restaurants.length)}catch(error){if(currentRequest===requestId){lastRestaurants=[];renderCandidateList(start);showError(error.message)}}finally{if(currentRequest===requestId){button.disabled=false;button.firstElementChild.textContent="식당 후보 불러오기"}}}
    function refreshAfterTimeChange(){const validation=validSettings(),start=selectedBuilding("#start"),end=selectedBuilding("#end");selectedCafe=null;if(validation){lastCafes=[];renderBaseMarkers(start,end,selectedRestaurant);renderCandidateList(start);showError(validation);return}if(selectedRestaurant)selectRestaurant(selectedRestaurant,start,end);else resetRouteSummary("식당 후보를 선택하세요",lastRestaurants.length)}
    async function init(){map=new kakao.maps.Map($("#map"),{center:new kakao.maps.LatLng(37.5665,126.9780),level:4});map.addControl(new kakao.maps.ZoomControl(),kakao.maps.ControlPosition.RIGHT);places=new kakao.maps.services.Places();populateControls(true);try{await resolveCampusCoordinates();await recommend()}catch(error){coordinatesReady=false;showError(error.message,true)}}
    $$('[data-campus]').forEach(button=>button.addEventListener("click",async()=>{campus=button.dataset.campus;requestId++;coordinatesReady=false;lastRestaurants=[];lastCafes=[];selectedRestaurant=null;selectedCafe=null;activeResultTab="restaurant";$$('[data-campus]').forEach(item=>item.classList.toggle("active",item===button));populateControls(true);clearMap();try{await resolveCampusCoordinates();await recommend()}catch(error){coordinatesReady=false;showError(error.message,true)}}));
    $("#start").addEventListener("change",recommend);$("#end").addEventListener("change",recommend);$("#radius").addEventListener("change",recommend);["#depart","#returnTime","#mealMinutes","#cafeMinutes"].forEach(id=>$(id).addEventListener("change",refreshAfterTimeChange));$("#recommend").addEventListener("click",recommend);$("#closePlace").addEventListener("click",()=>$("#placeSheet").classList.add("hide"));window.addEventListener("resize",()=>map&&map.relayout());
    $$("[data-result-tab]").forEach(button=>button.addEventListener("click",()=>{if(button.disabled)return;activeResultTab=button.dataset.resultTab;renderCandidateList(selectedBuilding("#start"))}));
    if(window.kakao&&window.kakao.maps)kakao.maps.load(init);else showError("카카오맵 SDK를 불러오지 못했습니다. JavaScript 키와 등록 도메인을 확인해 주세요.",true);
  </script>
